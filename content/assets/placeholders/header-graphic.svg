<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER — the BLANK TRANSPARENT default for the decorative `header-graphic`
  role (`site.assets.headerGraphic`).

  It draws nothing: a fresh Foundation installation is valid and complete with a
  blank decorative header band, and the role stays fully supported and
  swappable. Replace this file in place (or re-point the role at an absolute
  URL) to activate a deployment's own header graphic.

  Source of truth: content/assets/placeholders/header-graphic.svg
  Runtime derivative: public/assets/header-graphic.svg — GENERATED by
  `pnpm assets:sync` (see scripts/sync-runtime-assets.mjs). NEVER edit the runtime
  copy by hand, and never treat it as a second place to maintain artwork.

  A deployment's own branded artwork for this role belongs under
  `content/assets/branding/`. NOT BRAND AUTHORITY.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="512" viewBox="0 0 4096 512" fill="none" role="presentation" aria-hidden="true"></svg>
